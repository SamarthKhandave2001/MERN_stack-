<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegant Login</title>
    <link href="./output.css" rel="stylesheet">
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-indigo-900 to-slate-800">

    <div class="w-full max-w-md p-10 rounded-3xl bg-white/10 backdrop-blur-xl shadow-2xl border border-white/20">

        <h2 class="text-3xl font-bold text-white text-center mb-2">Welcome Back 👋</h2>
        <p class="text-indigo-200 text-center mb-8">Please login to continue</p>

        <form>

            <!-- Email -->
            <div class="mb-5">
                <label class="block text-indigo-100 mb-2 text-sm">Email</label>
                <input type="email" placeholder="Enter your email"
                    class="w-full px-4 py-3 rounded-xl bg-white/20 text-white placeholder-indigo-200 border border-indigo-300/30 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition">
            </div>

            <!-- Password -->
            <div class="mb-6">
                <label class="block text-indigo-100 mb-2 text-sm">Password</label>
                <input type="password" placeholder="Enter password"
                    class="w-full px-4 py-3 rounded-xl bg-white/20 text-white placeholder-indigo-200 border border-indigo-300/30 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition">
            </div>

            <div class="flex justify-between text-sm mb-6">
                <label class="text-indigo-200">
                    <input type="checkbox" class="mr-1 accent-indigo-500"> Remember me
                </label>
                <a href="#" class="text-indigo-300 hover:text-white">Forgot?</a>
            </div>

            <button
                class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-500 via-purple-500 to-indigo-600 text-white font-semibold shadow-lg hover:scale-105 transition duration-300">
                Login
            </button>

        </form>

        <p class="text-center text-indigo-200 mt-6 text-sm">
            New user?
            <a href="#" class="text-white font-semibold">Create account</a>
        </p>

    </div>

</body>
</html>

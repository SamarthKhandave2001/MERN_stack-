<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link href="./output.css" rel="stylesheet">
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-100 via-white to-slate-200">

    <div class="w-full max-w-md bg-white rounded-3xl p-10 shadow-[0_20px_40px_rgba(0,0,0,0.08)]">

        <!-- Logo / Title -->
        <div class="text-center mb-8">
            <div class="mx-auto mb-4 w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-indigo-500"></div>
            <h2 class="text-3xl font-semibold text-gray-900">Sign in</h2>
            <p class="text-gray-500 mt-1">Continue to your account</p>
        </div>

        <form>

            <!-- Email -->
            <div class="mb-5">
                <label class="block text-sm text-gray-600 mb-1">Email</label>
                <input type="email" placeholder="you@example.com"
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-gray-50 text-gray-900
                    focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
            </div>

            <!-- Password -->
            <div class="mb-6">
                <label class="block text-sm text-gray-600 mb-1">Password</label>
                <input type="password" placeholder="••••••••"
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-gray-50 text-gray-900
                    focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>

            <!-- Remember / Forgot -->
            <div class="flex justify-between items-center mb-6 text-sm">
                <label class="flex items-center text-gray-600">
                    <input type="checkbox" class="mr-2 accent-blue-600"> Remember me
                </label>
                <a href="#" class="text-blue-600 hover:underline">Forgot password?</a>
            </div>

            <!-- Button -->
            <button
                class="w-full py-3 rounded-xl bg-blue-600 text-white font-medium shadow-md
                hover:bg-blue-700 hover:shadow-lg transition duration-300">
                Sign in
            </button>

        </form>

        <p class="text-center text-gray-500 text-sm mt-6">
            Don’t have an account?
            <a href="#" class="text-blue-600 font-medium hover:underline">Create one</a>
        </p>

    </div>

</body>
</html>

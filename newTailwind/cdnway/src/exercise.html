<!--
Style A Button with Tailwind CSS
Intructions:

Create a button using a <button> tag with bg-blue-500.

Add classes to style the button with padding, background color, rounded corners, and a hover effect that changes its color to bg-blue-700.

Add the Tailwind CSS CDN in head tag:

<head><link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"></head>
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Button</title>
    
    <!-- Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="flex items-center justify-center h-screen bg-gray-100">

    <button class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition duration-300">
        Click Me
    </button>

</body>

2- Center a Div Using Flexbox
Instructions:

Create a div (parent container) and give it the id="parent". This div should contain another div (child container) with id="child".

Use Tailwind CSS's flexbox utilities to center the child div inside the parent both vertically and horizontally within the viewport.

The content inside the child div should consist of:

A heading (<h1>) with the class text-2xl.

A paragraph (<p>) explaining that the div is centered.

Add the following Tailwind CSS CDN link to the <head> section:

<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

Ensure that both the parent and child divs have the specified id attributes for the tests to pass.

-->
<html>
<!--Add your HTML code here-->
<head>
    <meta charset="UTF-8">
    <title>Center Div Using Flexbox</title>
    
    <!-- Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>

    <!-- Parent Container -->
    <div id="parent" class="flex items-center justify-center h-screen bg-gray-100">
        
        <!-- Child Container -->
        <div id="child" class="bg-white p-8 rounded-lg shadow-md text-center">
            <h1 class="text-2xl font-bold mb-4">Centered Div</h1>
            <p>This div is perfectly centered both vertically and horizontally using Tailwind Flexbox utilities.</p>
        </div>

    </div>

</body>
</html>

3- Create a Basic Grid Layout
Instructions:

Create a div container to hold the grid.

Inside the container, add four child div elements.

Use Tailwind CSS’s grid utilities to create a 2x2 grid layout.

Add a unique background color to each div to differentiate the grid cells.

Include the Tailwind CSS CDN link inside the  <head>:

<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
-->

<html>
<!--Add your HTML code here-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Grid Layout</title>

    <!-- Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="flex items-center justify-center h-screen bg-gray-100">

    <!-- Grid Container -->
    <div class="grid grid-cols-2 gap-4 w-80">
        
        <!-- Grid Item 1 -->
        <div class="bg-red-400 p-6 text-white text-center rounded">
            Item 1
        </div>

        <!-- Grid Item 2 -->
        <div class="bg-blue-400 p-6 text-white text-center rounded">
            Item 2
        </div>

        <!-- Grid Item 3 -->
        <div class="bg-green-400 p-6 text-white text-center rounded">
            Item 3
        </div>

        <!-- Grid Item 4 -->
        <div class="bg-yellow-400 p-6 text-white text-center rounded">
            Item 4
        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Grid Master Class Demo</title>
</head>
<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.6;
        margin:0;
        padding:20px;
        background-color: #f0f0f0;
    }
    h1,h2{
       color: #333; 
    }
    .container{
        background-color: #fff;
        border: 2px solid #333;
        margin-top: 20px;
        padding: 10px;
    }
    .grid-container{
        display: grid;
        gap: 10px;
        background-color: #ddd;
        padding: 10px;
        margin-bottom: 10px;
    }
    .box{
        background-color: white;
       
        padding: 20px;
        font-size: 18px;
        text-align: center;
    }
    .box:nth-child(even){
        background-color: red;
    }
</style>
<body>
    <h1> CSS Grid Master Demo</h1>
    <div class="container">
        <h2>1. Basic Gird</h2>
        <div class="grid-container"style="grid-template-columns: repeat(3, 1fr); gird-template-rows: auto;">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4 </div>
        </div>
    </div>
    <div class="container">
        <h2> Grid with difference column size</h2>
        <div class="grid-container">
            <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
    
</body>
</html>
